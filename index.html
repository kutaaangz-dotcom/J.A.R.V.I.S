<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J.A.R.V.I.S</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#01060b;
  font-family:Arial,Helvetica,sans-serif;
  color:#9eeeff
}

body{
  background:
    radial-gradient(circle at 50% 49%,rgba(0,170,255,.12),transparent 23%),
    radial-gradient(circle at 50% 50%,rgba(0,50,80,.20),transparent 48%),
    linear-gradient(#02070d,#000307 70%,#02070d);
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.25;
  background:repeating-linear-gradient(
    0deg,
    transparent 0 3px,
    rgba(80,190,255,.035) 4px
  );
}

.app{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center
}

/* TOP BRANDING */

.brand{
  position:absolute;
  top:5.5vh;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  letter-spacing:.42em
}

.brand h1{
  margin:0;
  font-size:clamp(30px,6vw,56px);
  font-weight:300;
  text-shadow:0 0 12px #00bfff
}

.brand p{
  margin:8px 0 0;
  font-size:9px;
  letter-spacing:.28em;
  opacity:.6
}

/* CENTRAL REACTOR */

.reactor{
  position:relative;
  width:min(82vw,520px);
  aspect-ratio:1
}

.ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:1px solid rgba(0,196,255,.35);
  box-shadow:0 0 20px rgba(0,180,255,.07) inset
}

.r1{
  inset:2%;
  border-color:rgba(0,210,255,.28);
  animation:spin 22s linear infinite
}

.r2{
  inset:9%;
  border-style:dashed;
  border-color:rgba(60,220,255,.45);
  animation:spinReverse 17s linear infinite
}

.r3{
  inset:18%;
  border-color:rgba(0,185,255,.26);
  animation:spin 13s linear infinite
}

.r4{
  inset:27%;
  border:1px solid rgba(80,225,255,.5);
  box-shadow:0 0 25px rgba(0,180,255,.15) inset
}

.r5{
  inset:35%;
  border:2px solid rgba(40,215,255,.42);
  box-shadow:
    0 0 35px rgba(0,190,255,.28),
    0 0 70px rgba(0,100,255,.12) inset
}

.tick{
  position:absolute;
  inset:5%;
  border-radius:50%;
  background:
    repeating-conic-gradient(
      from 0deg,
      rgba(80,220,255,.7) 0deg 1deg,
      transparent 1deg 12deg
    );

  -webkit-mask:
    radial-gradient(
      circle,
      transparent 0 88%,
      #000 88.5% 91%,
      transparent 91.5%
    );

  mask:
    radial-gradient(
      circle,
      transparent 0 88%,
      #000 88.5% 91%,
      transparent 91.5%
    );

  animation:spin 30s linear infinite
}

.sweep{
  position:absolute;
  inset:6%;
  border-radius:50%;
  overflow:hidden;
  opacity:.7;
  animation:spin 7s linear infinite
}

.sweep:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:48%;
  height:1px;
  transform-origin:left center;
  transform:rotate(-8deg);
  background:linear-gradient(
    90deg,
    rgba(0,225,255,.8),
    transparent
  );
  box-shadow:0 0 8px #00cfff
}

/* CORE */

.core{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:42%;
  aspect-ratio:1;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 50% 50%,
      #dffcff 0 3%,
      #5eeaff 8%,
      #0795d5 22%,
      rgba(0,50,90,.9) 47%,
      transparent 70%
    );

  box-shadow:
    0 0 18px #00d9ff,
    0 0 45px rgba(0,195,255,.8),
    0 0 90px rgba(0,120,255,.35);
}

.core:before,
.core:after{
  content:"";
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(120,235,255,.75)
}

.core:before{
  inset:-10%;
  animation:pulse 2.2s ease-in-out infinite
}

.core:after{
  inset:-19%;
  border-color:rgba(0,175,255,.22);
  animation:pulse 2.2s ease-in-out infinite reverse
}

.core span{
  font-size:clamp(9px,2vw,14px);
  letter-spacing:.22em;
  color:white;
  text-shadow:0 0 10px #00cfff
}

/* ORBIT NODES */

.node{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#a9f7ff;
  box-shadow:
    0 0 8px #00d9ff,
    0 0 18px #008cff
}

.n1{left:13%;top:27%}
.n2{right:12%;top:32%}
.n3{left:21%;bottom:22%}
.n4{right:19%;bottom:19%}

.cross{
  position:absolute;
  left:50%;
  top:50%;
  width:76%;
  height:1px;
  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(90,225,255,.3),
      transparent
    );
  transform:translate(-50%,-50%)
}

.cross.v{
  transform:translate(-50%,-50%) rotate(90deg)
}

.corner{
  position:absolute;
  width:32px;
  height:32px;
  border-color:rgba(40,210,255,.65)
}

.c1{
  top:18%;
  left:18%;
  border-top:1px solid;
  border-left:1px solid
}

.c2{
  top:18%;
  right:18%;
  border-top:1px solid;
  border-right:1px solid
}

.c3{
  bottom:18%;
  left:18%;
  border-bottom:1px solid;
  border-left:1px solid
}

.c4{
  bottom:18%;
  right:18%;
  border-bottom:1px solid;
  border-right:1px solid
}

/* STATUS */

.status{
  position:absolute;
  bottom:5.5vh;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  min-width:240px
}

.status .state{
  font-size:9px;
  letter-spacing:.32em;
  opacity:.72
}

.bar{
  height:2px;
  margin-top:12px;
  background:rgba(80,220,255,.12);
  overflow:hidden
}

.bar i{
  display:block;
  width:72%;
  height:100%;
  background:#35dfff;
  box-shadow:0 0 9px #00d9ff;
  animation:load 3s ease-in-out infinite
}

.clock{
  position:absolute;
  top:6vh;
  right:4vw;
  text-align:right;
  font-size:9px;
  letter-spacing:.18em;
  opacity:.5
}

.leftinfo{
  position:absolute;
  left:4vw;
  bottom:7vh;
  font-size:8px;
  line-height:2;
  letter-spacing:.16em;
  opacity:.45
}

.rightinfo{
  position:absolute;
  right:4vw;
  bottom:7vh;
  text-align:right;
  font-size:8px;
  line-height:2;
  letter-spacing:.16em;
  opacity:.45
}

/* ANIMATION */

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes spinReverse{
  to{transform:rotate(-360deg)}
}

@keyframes pulse{
  50%{
    opacity:.35;
    transform:scale(1.06)
  }
}

@keyframes load{
  0%,100%{width:48%}
  50%{width:86%}
}

/* VOICE STATES */

.reactor.listening .core{
  box-shadow:
    0 0 25px #00eaff,
    0 0 70px rgba(0,220,255,.9),
    0 0 120px rgba(0,120,255,.45);

  animation:voicePulse .8s ease-in-out infinite
}

.reactor.thinking .core{
  animation:voicePulse .45s ease-in-out infinite
}

.reactor.speaking .core{
  animation:voicePulse 1.1s ease-in-out infinite
}

@keyframes voicePulse{
  50%{
    transform:translate(-50%,-50%) scale(1.08);
    filter:brightness(1.3)
  }
}

@media(max-width:600px){

  .reactor{
    width:92vw
  }

  .brand{
    top:4vh
  }

  .clock,
  .leftinfo,
  .rightinfo{
    display:none
  }

  .status{
    bottom:4vh
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="brand">
    <h1>J.A.R.V.I.S</h1>
    <p>JUST A RATHER VERY INTELLIGENT SYSTEM</p>
  </div>

  <div class="clock" id="clock">
    SYSTEM TIME // --:--:--
  </div>

  <div class="reactor">

    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="ring r5"></div>

    <div class="tick"></div>
    <div class="sweep"></div>

    <div class="cross"></div>
    <div class="cross v"></div>

    <div class="corner c1"></div>
    <div class="corner c2"></div>
    <div class="corner c3"></div>
    <div class="corner c4"></div>

    <i class="node n1"></i>
    <i class="node n2"></i>
    <i class="node n3"></i>
    <i class="node n4"></i>

    <div class="core">
      <span>J.A.R.V.I.S</span>
    </div>

  </div>

  <div class="leftinfo">
    NEURAL CORE<br>
    ONLINE<br>
    MEMORY ACTIVE
  </div>

  <div class="rightinfo">
    AUDIO LINK<br>
    STANDBY<br>
    NETWORK OK
  </div>

  <div class="status">
    <div class="state" id="systemState">
      SYSTEM ONLINE // AWAITING COMMAND
    </div>

    <div class="bar">
      <i id="progressBar"></i>
    </div>
  </div>

</div>


<!-- VOICE CONTROL -->

<div
  id="voiceLock"
  style="
    position:fixed;
    left:50%;
    bottom:12vh;
    transform:translateX(-50%);
    z-index:20;
    text-align:center;
    font:10px Arial;
    letter-spacing:.25em;
    color:#9eeeff;
    opacity:.8
  "
>

  <button
    id="micBtn"
    aria-label="Aktifkan JARVIS"
    style="
      width:64px;
      height:64px;
      border-radius:50%;
      border:1px solid rgba(70,220,255,.7);
      background:radial-gradient(circle,#073b56,#02080d 65%);
      color:#bffaff;
      box-shadow:0 0 18px rgba(0,210,255,.35);
      font-size:24px
    "
  >◉</button>

  <div
    id="voiceState"
    style="margin-top:8px"
  >
    VOICE LOCK // STANDBY
  </div>

</div>


<script>

/* SYSTEM CLOCK */

function updateClock(){

  const d=new Date();

  document.getElementById("clock").textContent=
    "SYSTEM TIME // "+
    d.toLocaleTimeString(
      "id-ID",
      {hour12:false}
    );
}

updateClock();

setInterval(updateClock,1000);


/* JARVIS VOICE SYSTEM */

(() => {

  const btn=document.getElementById("micBtn");
  const state=document.getElementById("voiceState");
  const reactor=document.querySelector(".reactor");

  const SR=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  /* MEMORY JARVIS */

  let conversationHistory=[];

  /* STATUS */

  function setState(text){

    state.textContent=text;

    reactor.classList.toggle(
      "listening",
      text.includes("LISTENING")
    );

    reactor.classList.toggle(
      "thinking",
      text.includes("THINKING")
    );

    reactor.classList.toggle(
      "speaking",
      text.includes("SPEAKING")
    );
  }


  /* BROWSER VOICE */

  function speakBrowser(text){

    return new Promise(resolve => {

      if(!("speechSynthesis" in window)){
        resolve();
        return;
      }

      speechSynthesis.cancel();

      const utterance=
        new SpeechSynthesisUtterance(text);

      utterance.lang="id-ID";
      utterance.rate=.92;
      utterance.pitch=.72;
      utterance.volume=1;

      const voices=
        speechSynthesis.getVoices();

      const voice=
        voices.find(v =>
          v.lang &&
          v.lang.toLowerCase().startsWith("id")
        );

      if(voice){
        utterance.voice=voice;
      }

      utterance.onstart=()=>{
        setState("JARVIS // SPEAKING");
      };

      utterance.onend=()=>{
        setState("VOICE LOCK // STANDBY");
        resolve();
      };

      utterance.onerror=()=>{
        setState("VOICE LOCK // STANDBY");
        resolve();
      };

      speechSynthesis.speak(utterance);

    });

  }


  /* GEMINI */

  async function askJarvis(message){

    setState("JARVIS // THINKING");

    try{

      const response=
        await fetch(
          "/.netlify/functions/chat",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

              message:message,

              /* KIRIM MEMORY */
              history:conversationHistory

            })
          }
        );


      const data=
        await response
          .json()
          .catch(()=>({}));


      if(
        !response.ok ||
        !data.answer
      ){
        throw new Error(
          data.error ||
          "Gemini tidak merespons."
        );
      }


      const answer=
        String(data.answer).trim();


      /* SIMPAN MEMORY */

      conversationHistory.push({

        role:"user",

        content:message

      });


      conversationHistory.push({

        role:"assistant",

        content:answer

      });


      /* BATASI MEMORY */

      if(
        conversationHistory.length>12
      ){

        conversationHistory=
          conversationHistory.slice(-12);

      }


      /* BICARAKAN JAWABAN */

      await speakBrowser(answer);

    }

    catch(error){

      console.error(
        "JARVIS ERROR:",
        error
      );

      await speakBrowser(
        "Maaf, sistem AI belum dapat terhubung. Periksa koneksi dan konfigurasi Gemini."
      );

      setState(
        "VOICE LOCK // STANDBY"
      );

    }

  }


  /* BROWSER TIDAK SUPPORT */

  if(!SR){

    setState(
      "VOICE INPUT // UNSUPPORTED"
    );

    return;

  }


  /* SPEECH RECOGNITION */

  const recognition=
    new SR();

  recognition.lang="id-ID";

  recognition.continuous=false;

  recognition.interimResults=false;

  recognition.maxAlternatives=1;


  let listening=false;


  /* MICROPHONE BUTTON */

  btn.onclick=()=>{

    if(listening){

      return;

    }


    listening=true;


    setState(
      "JARVIS // LISTENING"
    );


    try{

      recognition.start();

    }

    catch(error){

      console.error(error);

      listening=false;

      setState(
        "VOICE LOCK // STANDBY"
      );

    }

  };


  /* HASIL SUARA */

  recognition.onresult=(event)=>{

    const text=
      event.results?.[0]?.[0]?.transcript
        ?.trim();


    if(!text){

      listening=false;

      setState(
        "VOICE LOCK // STANDBY"
      );

      return;

    }


    /* GEMINI */

    askJarvis(text);

  };


  /* ERROR MICROPHONE */

  recognition.onerror=(event)=>{

    console.error(
      "VOICE ERROR:",
      event.error
    );

    listening=false;

    setState(
      "VOICE LOCK // STANDBY"
    );

  };


  /* SELESAI LISTENING */

  recognition.onend=()=>{

    listening=false;

  };


})();

</script>

</body>
</html>
