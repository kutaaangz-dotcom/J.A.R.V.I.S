<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>J.A.R.V.I.S</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">

  <meta name="theme-color" content="#01060b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #01060b;
      font-family: Arial, Helvetica, sans-serif;
      color: #dffcff;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* BACKGROUND */

    .background {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(
          circle at center,
          rgba(0, 210, 255, 0.08),
          transparent 35%
        ),
        radial-gradient(
          circle at center,
          rgba(0, 120, 255, 0.04),
          transparent 65%
        ),
        #01060b;
      z-index: 0;
    }

    .grid {
      position: fixed;
      inset: 0;
      opacity: 0.13;
      background-image:
        linear-gradient(
          rgba(0, 200, 255, 0.08) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(0, 200, 255, 0.08) 1px,
          transparent 1px
        );
      background-size: 45px 45px;
      mask-image: radial-gradient(circle, black, transparent 75%);
      -webkit-mask-image: radial-gradient(circle, black, transparent 75%);
      z-index: 1;
    }

    /* MAIN */

    .jarvis {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* TOP */

    .top {
      position: absolute;
      top: 30px;
      left: 0;
      width: 100%;
      text-align: center;
      letter-spacing: 5px;
      font-size: 12px;
      color: rgba(170, 240, 255, 0.8);
    }

    .top span {
      color: #66eaff;
      text-shadow:
        0 0 8px rgba(0, 220, 255, 0.8),
        0 0 20px rgba(0, 220, 255, 0.4);
    }

    /* CLOCK */

    #clock {
      position: absolute;
      top: 55px;
      right: 25px;
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(120, 225, 245, 0.6);
    }

    /* REACTOR */

    .reactor {
      width: min(72vw, 330px);
      height: min(72vw, 330px);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(0, 218, 255, 0.3);
      box-shadow:
        0 0 10px rgba(0, 200, 255, 0.12),
        inset 0 0 10px rgba(0, 200, 255, 0.06);
    }

    .ring1 {
      width: 100%;
      height: 100%;
      animation: rotate 18s linear infinite;
    }

    .ring2 {
      width: 82%;
      height: 82%;
      border-style: dashed;
      border-color: rgba(0, 210, 255, 0.35);
      animation: rotateReverse 12s linear infinite;
    }

    .ring3 {
      width: 64%;
      height: 64%;
      border-color: rgba(90, 235, 255, 0.5);
      animation: rotate 8s linear infinite;
    }

    .ring4 {
      width: 47%;
      height: 47%;
      border-width: 2px;
      border-color: rgba(0, 230, 255, 0.55);
      box-shadow:
        0 0 20px rgba(0, 210, 255, 0.25),
        inset 0 0 20px rgba(0, 210, 255, 0.15);
    }

    .ring1::before,
    .ring1::after,
    .ring2::before,
    .ring2::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7cefff;
      box-shadow:
        0 0 8px #00d9ff,
        0 0 20px rgba(0, 217, 255, 0.7);
    }

    .ring1::before {
      top: -3px;
      left: 50%;
    }

    .ring1::after {
      bottom: -3px;
      right: 20%;
    }

    .ring2::before {
      left: -3px;
      top: 30%;
    }

    .ring2::after {
      right: -3px;
      bottom: 25%;
    }

    /* CORE */

    .core {
      width: 31%;
      height: 31%;
      border-radius: 50%;
      position: relative;
      background:
        radial-gradient(
          circle,
          #ffffff 0%,
          #a9f8ff 12%,
          #2be5ff 32%,
          rgba(0, 190, 255, 0.5) 58%,
          transparent 72%
        );
      box-shadow:
        0 0 15px #00d9ff,
        0 0 35px rgba(0, 217, 255, 0.8),
        0 0 75px rgba(0, 180, 255, 0.45);
      animation: pulse 2.2s ease-in-out infinite;
    }

    .core::before {
      content: "";
      position: absolute;
      inset: -25%;
      border-radius: 50%;
      border: 1px solid rgba(0, 225, 255, 0.5);
      animation: pulseRing 2.2s ease-in-out infinite;
    }

    .core::after {
      content: "";
      position: absolute;
      inset: 20%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      filter: blur(5px);
    }

    /* MIC */

    .mic-container {
      position: absolute;
      bottom: 82px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #micButton {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 1px solid rgba(90, 235, 255, 0.7);
      background:
        radial-gradient(
          circle,
          rgba(0, 230, 255, 0.25),
          rgba(0, 70, 100, 0.18)
        );
      color: #aef8ff;
      font-size: 26px;
      cursor: pointer;
      box-shadow:
        0 0 15px rgba(0, 210, 255, 0.3),
        inset 0 0 15px rgba(0, 210, 255, 0.15);
      transition: 0.2s;
    }

    #micButton:active {
      transform: scale(0.92);
    }

    #micButton.listening {
      box-shadow:
        0 0 20px #00e5ff,
        0 0 50px rgba(0, 210, 255, 0.7),
        inset 0 0 20px rgba(0, 210, 255, 0.35);
      animation: micPulse 1s infinite;
    }

    .status {
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(130, 230, 255, 0.7);
      text-transform: uppercase;
    }

    /* BOTTOM */

    .bottom {
      position: absolute;
      bottom: 24px;
      width: 100%;
      text-align: center;
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(120, 210, 230, 0.45);
    }

    /* ANIMATION */

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rotateReverse {
      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(0.94);
        opacity: 0.8;
      }

      50% {
        transform: scale(1.06);
        opacity: 1;
      }
    }

    @keyframes pulseRing {
      0%,
      100% {
        transform: scale(0.9);
        opacity: 0.3;
      }

      50% {
        transform: scale(1.15);
        opacity: 0.7;
      }
    }

    @keyframes micPulse {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    /* SMALL SCREEN */

    @media (max-height: 650px) {
      .reactor {
        width: min(60vw, 270px);
        height: min(60vw, 270px);
      }

      .mic-container {
        bottom: 55px;
      }

      .bottom {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>
  <div class="grid"></div>

  <main class="jarvis">

    <div class="top">
      J.A.R.V.I.S <span>ONLINE</span>
    </div>

    <div id="clock">00:00:00</div>

    <div class="reactor">

      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>
      <div class="ring ring4"></div>

      <div class="core"></div>

    </div>

    <div class="mic-container">

      <button
        id="micButton"
        aria-label="Aktifkan JARVIS"
        type="button"
      >
        🎙
      </button>

      <div class="status" id="status">
        READY
      </div>

    </div>

    <div class="bottom">
      PERSONAL AI ASSISTANT
    </div>

  </main>

  <script>
    /* =========================
       JARVIS CORE
    ========================= */

    const micButton =
      document.getElementById("micButton");

    const statusText =
      document.getElementById("status");

    const clock =
      document.getElementById("clock");

    let recognition = null;
    let isListening = false;

    let conversationHistory = [];

    /* =========================
       CLOCK
    ========================= */

    function updateClock() {

      const now = new Date();

      const h =
        String(now.getHours()).padStart(2, "0");

      const m =
        String(now.getMinutes()).padStart(2, "0");

      const s =
        String(now.getSeconds()).padStart(2, "0");

      clock.textContent =
        `${h}:${m}:${s}`;
    }

    updateClock();

    setInterval(
      updateClock,
      1000
    );

    /* =========================
       SPEECH RECOGNITION
    ========================= */

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (SpeechRecognition) {

      recognition =
        new SpeechRecognition();

      recognition.lang =
        "id-ID";

      recognition.continuous =
        false;

      recognition.interimResults =
        false;

      recognition.maxAlternatives =
        1;

      recognition.onstart =
        () => {

          isListening = true;

          micButton.classList.add(
            "listening"
          );

          statusText.textContent =
            "LISTENING";
        };

      recognition.onresult =
        async (event) => {

          const transcript =
            event
              .results[0][0]
              .transcript
              .trim();

          if (!transcript) {
            statusText.textContent =
              "READY";
            return;
          }

          statusText.textContent =
            "THINKING";

          await askJarvis(
            transcript
          );
        };

      recognition.onerror =
        (event) => {

          console.error(
            "Speech recognition error:",
            event.error
          );

          isListening = false;

          micButton.classList.remove(
            "listening"
          );

          if (
            event.error ===
            "not-allowed"
          ) {

            statusText.textContent =
              "MIC DENIED";

          } else {

            statusText.textContent =
              "READY";
          }
        };

      recognition.onend =
        () => {

          isListening = false;

          micButton.classList.remove(
            "listening"
          );

          if (
            statusText.textContent ===
            "LISTENING"
          ) {

            statusText.textContent =
              "READY";
          }
        };

    } else {

      statusText.textContent =
        "VOICE UNSUPPORTED";

      micButton.disabled = true;
    }

    /* =========================
       MIC BUTTON
    ========================= */

    micButton.addEventListener(
      "click",
      () => {

        if (!recognition) {
          return;
        }

        if (isListening) {

          recognition.stop();

          return;
        }

        try {

          recognition.start();

        } catch (error) {

          console.error(
            "Mic start error:",
            error
          );

        }
      }
    );

    /* =========================
       ASK JARVIS
    ========================= */

    async function askJarvis(
      message
    ) {

      try {

        const history =
          conversationHistory
            .slice(-12);

        const response =
          await fetch(
            "/.netlify/functions/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message:
                  message,

                history:
                  history
              })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {

          console.error(
            "JARVIS API ERROR:",
            data
          );

          statusText.textContent =
            "SYSTEM ERROR";

          speak(
            "Maaf, terjadi gangguan pada sistem JARVIS."
          );

          setTimeout(
            () => {
              statusText.textContent =
                "READY";
            },
            2500
          );

          return;
        }

        const answer =
          String(
            data.answer || ""
          ).trim();

        if (!answer) {

          statusText.textContent =
            "NO RESPONSE";

          setTimeout(
            () => {
              statusText.textContent =
                "READY";
            },
            2000
          );

          return;
        }

        /* SIMPAN KONTEKS */

        conversationHistory.push({
          role: "user",
          content: message
        });

        conversationHistory.push({
          role: "assistant",
          content: answer
        });

        conversationHistory =
          conversationHistory.slice(-12);

        /* JAWAB DENGAN SUARA */

        speak(answer);

      } catch (error) {

        console.error(
          "JARVIS connection error:",
          error
        );

        statusText.textContent =
          "OFFLINE";

        speak(
          "Koneksi ke pusat sistem sedang bermasalah."
        );

        setTimeout(
          () => {
            statusText.textContent =
              "READY";
          },
          2500
        );
      }
    }

    /* =========================
       TEXT TO SPEECH
    ========================= */

    function speak(text) {

      if (
        !("speechSynthesis" in window)
      ) {

        statusText.textContent =
          "READY";

        return;
      }

      window.speechSynthesis.cancel();

      const utterance =
        new SpeechSynthesisUtterance(
          text
        );

      utterance.lang =
        "id-ID";

      utterance.rate =
        0.92;

      utterance.pitch =
        0.72;

      const voices =
        window.speechSynthesis
          .getVoices();

      const IndonesianVoice =
        voices.find(
          voice =>
            voice.lang &&
            voice.lang
              .toLowerCase()
              .startsWith("id")
        );

      if (IndonesianVoice) {

        utterance.voice =
          IndonesianVoice;
      }

      utterance.onstart =
        () => {

          statusText.textContent =
            "SPEAKING";
        };

      utterance.onend =
        () => {

          statusText.textContent =
            "READY";
        };

      utterance.onerror =
        () => {

          statusText.textContent =
            "READY";
        };

      window.speechSynthesis.speak(
        utterance
      );
    }

    /* =========================
       LOAD VOICES
    ========================= */

    if (
      "speechSynthesis" in window
    ) {

      window.speechSynthesis
        .onvoiceschanged =
        () => {

          window.speechSynthesis
            .getVoices();
        };
    }

    /* =========================
       SERVICE WORKER / PWA
    ========================= */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("/sw.js")
            .then(
              () => {

                console.log(
                  "JARVIS Service Worker aktif."
                );
              }
            )
            .catch(
              error => {

                console.error(
                  "Service Worker gagal:",
                  error
                );
              }
            );
        }
      );
    }
  </script>

</body>
  </html>
